name: bingo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: bingo_master
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bingo} -d bingo_master"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./.env
    environment:
      MASTER_DB_URL: jdbc:postgresql://postgres:5432/bingo_master
      MASTER_DB_USERNAME: ${POSTGRES_USER:-bingo}
      MASTER_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TENANT_DB_URL: jdbc:postgresql://postgres:5432/bingo_master
      TENANT_DB_USERNAME: ${POSTGRES_USER:-bingo}
      TENANT_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      tenant.datasource.default-database: bingo_master
      SCREENSHOTS_DIR: /data/screenshots
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1024m
    volumes:
      - screenshots:/data/screenshots
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BINGO_DOMAIN: ${BINGO_DOMAIN:?set BINGO_DOMAIN in deploy/.env (e.g. app.duckdns.org)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - backend

volumes:
  pgdata:
  screenshots:
  caddy_data:
  caddy_config:

networks:
  backend: