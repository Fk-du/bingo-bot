# Test profile - override via .env vars or local ..env
master.datasource.url=${MASTER_DB_URL:jdbc:postgresql://localhost:5432/bingo_master}
master.datasource.username=${MASTER_DB_USERNAME:postgres}
master.datasource.password=${MASTER_DB_PASSWORD:postgres}
tenant.datasource.url=${TENANT_DB_URL:jdbc:postgresql://localhost:5432/postgres}
tenant.datasource.username=${TENANT_DB_USERNAME:postgres}
tenant.datasource.password=${TENANT_DB_PASSWORD:postgres}
tenant.datasource.default-database=bingo_master
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
bingo.telegram.bot.username=${TELEGRAM_BOT_USERNAME:test_bot}
bingo.telegram.bot.token=${TELEGRAM_BOT_TOKEN:test_token}
app.super-admin.telegram-id=${SUPER_ADMIN_TELEGRAM_ID:0}
bingo.webapp.url=${BINGO_WEBAPP_URL:http://localhost:5173}
app.multi-tenant.enabled=true
