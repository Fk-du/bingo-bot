spring.application.name=bingo
spring.config.import=optional:file:.env[.properties]

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
# ===============================
# MASTER DATABASE (user auth + tenant registry)
# ===============================
master.datasource.url=${MASTER_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/bingo_master}}
master.datasource.username=${MASTER_DB_USERNAME:${DB_USERNAME:postgres}}
master.datasource.password=${MASTER_DB_PASSWORD:${DB_PASSWORD:}}

# ===============================
# BOT USERNAME AND TOKEN
# ===============================
app.telegram.bot.username=${BOT_USERNAME}
app.telegram.bot.token=${BOT_TOKEN}

# ===============================
# TENANT DATABASES (per-agent databases)
# ===============================
tenant.datasource.url=${TENANT_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/bingo_master}}
tenant.datasource.username=${TENANT_DB_USERNAME:${DB_USERNAME:postgres}}
tenant.datasource.password=${TENANT_DB_PASSWORD:${DB_PASSWORD:}}
tenant.datasource.default-database=bingo_master

# ===============================
# SERVER CONFIG
# ===============================
app.super-admin.telegram-id=${SUPER_ADMIN_TELEGRAM_ID}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prevent lazy loading issues in Telegram bot context
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.bingo=DEBUG

# ===============================
# TELEGRAM BOT CONFIG
# ===============================
# BOT_USERNAME and BOT_TOKEN must belong to the same Telegram bot account.
bingo.telegram.bot.username=${TELEGRAM_BOT_USERNAME:${BOT_USERNAME:}}
bingo.telegram.bot.token=${TELEGRAM_BOT_TOKEN:${BOT_TOKEN:}}

# ===============================
# BUSINESS CONFIG (BINGO RULES)
# ===============================
bingo.max-winners=3
bingo.card-size=25
bingo.number-range=75
bingo.auto-call-interval-ms=5000

# reward split mode: EQUAL | WEIGHTED
bingo.reward-mode=EQUAL

# Fee and commission rates (e.g., 0.10 = 10%)
bingo.fees.admin-commission-percent=10

# ===============================
# SECURITY / SAFETY
# ===============================
app.registration.require-invite=true
app.multi-tenant.enabled=true
app.game.default-entry-fee=10
app.game.default-max-players=50

# Telegram auth
bingo.telegram.auth.max-age-seconds=86400

# WEBAPP URL (set via environment variable or ..env)
bingo.webapp.url=${MINI_APP_URL:${BINGO_WEBAPP_URL:http://localhost:5173}}

# ===============================
# RATE LIMITING
# ===============================
bingo.rate-limit.max-requests=100
bingo.rate-limit.window-ms=60000

# ===============================
# PAYMENT SCREENSHOT UPLOADS (local private storage)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.screenshots.dir=${SCREENSHOTS_DIR:./data/screenshots}

# ===============================
# SCHEDULED TASKS
# ===============================
bingo.schedules.cleanup-interval-ms=600000
bingo.schedules.stale-registration-hours=24
bingo.schedules.stale-claim-minutes=30
bingo.schedules.stale-in-progress-hours=6
