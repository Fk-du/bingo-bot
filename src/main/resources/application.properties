spring.application.name=bingo
spring.config.import=optional:file:.env[.properties]

# ===============================
# SERVER CONFIG
# ===============================
server.port=8080
# server.servlet.context-path=/api

# ===============================
# DATABASE (POSTGRESQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# SERVER CONFIG
# ===============================
app.super-admin.telegram-id=${SUPER_ADMIN_TELEGRAM_ID}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Prevent lazy loading issues in Telegram bot context
spring.jpa.open-in-view=false

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.com.bingo=DEBUG

# Optional SQL logging (turn off in production later)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# TELEGRAM BOT CONFIG
# ===============================
# BOT_USERNAME and BOT_TOKEN must belong to the same Telegram bot account.
bingo.telegram.bot.username=${BOT_USERNAME:}
bingo.telegram.bot.token=${BOT_TOKEN:}

# ===============================
# BUSINESS CONFIG (BINGO RULES)
# ===============================
bingo.max-winners=3
bingo.card-size=25
bingo.number-range=75
bingo.auto-call-interval-ms=5000

# reward split mode: EQUAL | WEIGHTED
bingo.reward-mode=EQUAL

# ===============================
# SECURITY / SAFETY
# ===============================
app.registration.require-invite=true
app.multi-tenant.enabled=true
app.game.default-entry-fee=10
app.game.default-max-players=50

# prevent accidental schema drops
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Telegram auth
bingo.telegram.auth.max-age-seconds=86400

# WEBAPP  https://bingo-mini-app.pages.dev
bingo.webapp.url=https://e0ba-2605-6440-4013-3000-b13a-9d38-6b02-ef95.ngrok-free.app

